[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "village-graph"
version = "0.1.0"
description = "Evidence from the AI Village dataset, from a CLI: who did, said and claimed what, with citations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
llm = ["anthropic>=0.80"]
rlm = ["anthropic>=0.80", "rlms @ git+https://github.com/alexzhang13/rlm@d04208afbad29ca675ab13478c40ee8bebc84bfe"]

[project.scripts]
village = "village_graph.cli:main"
village-graph = "village_graph.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["village_graph"]

[tool.hatch.metadata]
allow-direct-references = true
